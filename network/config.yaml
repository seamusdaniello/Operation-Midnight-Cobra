# network/config.yaml
# Single source of truth for every static IP/port on the Pi <-> Arduino network.
# Edit this file when hardware changes — nothing in the .py scripts should
# hardcode an address anymore. No DHCP; every device below gets its IP set
# directly in its own Arduino sketch.

pi:
  ip: 192.168.50.10
  iface: eth0

arduinos:
  rf:
    ip: 192.168.50.20
    role: "RF contact reports — range/azimuth/elevation + alive heartbeat. One Arduino, 4 separate UDP ports, each carrying a single int32."
    data_port: 5006     # rf_receiver.py listens here (production, not yet updated for the 4-port layout)
    test_ports:         # test_arduino_connection.py listens on all 4 (decode/debug)
      range:     55001
      azimuth:   55002
      elevation: 55003
      alive:     55004

  servo_bridge:
    ip: 192.168.50.30
    role: "Azimuth/elevation servo position feedback + sweep start/stop"
    feedback_port: 5010  # Pi listens here for az/el position packets
    command_port: 5011   # Pi sends start/stop sweep commands here

  lidar_sink:
    ip: 192.168.50.101
    role: "Receives the LiDAR scan stream forwarded by pi_to_arduino.py"
    port: 5005

  # TODO: fill in IP once this Arduino is wired up and assigned an address.
  # Per "What we need to the arduino from the Pi.md": acousticAz, acousticEl,
  # acousticDetect.
  acoustic:
    ip: null
    role: "Acoustic detection node (az/el/detect)"
    port: null

  # TODO: fill in IP. Per the same notes: currentMode + DNE hit confirmation.
  fcp:
    ip: null
    role: "Fire control panel — currentMode, DNE hit confirmation"
    port: null

  # TODO: 6th Arduino's role and IP not yet decided.
  spare:
    ip: null
    role: null
    port: null

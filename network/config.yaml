# Static IP/port map for the Pi <-> Arduino network. Single source of truth —
# scripts read from here, no hardcoded addresses. No DHCP; 6 Arduinos total.

pi:
  ip: 192.168.50.10
  iface: eth0

arduinos:
  # RF Arduino: one int32 per port. Reports its own range/az/el, the LiDAR
  # gimbal az/el it drives, and an alive heartbeat.
  rf:
    ip: 192.168.50.101
    data_port: 5006      # rf_receiver.py (production aggregate listener)
    ports:
      rf_range:        55001
      rf_azimuth:      55002
      rf_elevation:    55003
      lidar_azimuth:   55004
      lidar_elevation: 55005
      alive:           55006

  # 5 acoustic boards, each with its own port block: 550<board><field>,
  # board = 2..6, field 0=az 1=range 2=detect 3=mic_id 4=board_id 5=zone.
  acoustic-1:
    ip: 192.168.50.102
    ports:
      az:       55020
      range:    55021
      detect:   55022
      mic_id:   55023
      board_id: 55024
      zone:     55025
  acoustic-2:
    ip: 192.168.50.103
    ports:
      az:       55030
      range:    55031
      detect:   55032
      mic_id:   55033
      board_id: 55034
      zone:     55035
  acoustic-3:
    ip: 192.168.50.104
    ports:
      az:       55040
      range:    55041
      detect:   55042
      mic_id:   55043
      board_id: 55044
      zone:     55045
  acoustic-4:
    ip: 192.168.50.105
    ports:
      az:       55050
      range:    55051
      detect:   55052
      mic_id:   55053
      board_id: 55054
      zone:     55055
  acoustic-5:
    ip: 192.168.50.106
    ports:
      az:       55060
      range:    55061
      detect:   55062
      mic_id:   55063
      board_id: 55064
      zone:     55065


# Static IP/port map for the Pi <-> Arduino network. Single source of truth —
# scripts read from here, no hardcoded addresses. No DHCP; 6 Arduinos total.

pi:
  ip: 192.168.50.10
  iface: eth0

arduinos:
  # RF Arduino: one int32 per port. Reports its own range/az/el, the LiDAR
  # gimbal az/el it drives, and an alive heartbeat.
  rf:
    ip: 192.168.50.101
    data_port: 5006      # rf_receiver.py (production aggregate listener)
    ports:
      rf_range:        55001
      rf_azimuth:      55002
      rf_elevation:    55003
      lidar_azimuth:   55004
      lidar_elevation: 55005
      alive:           55006

  # 5 acoustic boards, all sharing the same 5 ports. board_id/mic_id live in
  # the payload (not the port) to identify which board/mic a reading is from.
  acoustic-1:
    ip: 192.168.50.102
    ports: &acoustic_ports
      az:       55020
      range:    55021
      detect:   55022
      mic_id:   55023
      board_id: 55024
  acoustic-2:
    ip: 192.168.50.103
    ports: *acoustic_ports
  acoustic-3:
    ip: 192.168.50.104
    ports: *acoustic_ports
  acoustic-4:
    ip: 192.168.50.105
    ports: *acoustic_ports
  acoustic-5:
    ip: 192.168.50.106
    ports: *acoustic_ports

# TODO: FCP (currentMode, DNE hit confirmation) and the LiDAR-scan destination
# are not among the 6 boards above — placement still unresolved.
